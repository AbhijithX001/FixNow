{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login | FixNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root { --navy:#050d1f; --blue:#2563eb; --blue2:#3b82f6; --violet:#7c3aed; --violet2:#a855f7; --glass-bg:rgba(255,255,255,0.045); --glass-border:rgba(255,255,255,0.10); --input-bg:rgba(255,255,255,0.06); --input-border:rgba(255,255,255,0.14); }
        body { font-family:'Inter',sans-serif; background:var(--navy); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; position:relative; overflow:hidden; }
        .bg-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
        .orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(37,99,235,0.2) 0%,transparent 70%); top:-15%; left:-10%; }
        .orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(124,58,237,0.15) 0%,transparent 70%); bottom:-10%; right:-10%; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
        .auth-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:24px; padding:44px 40px; width:100%; max-width:420px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 24px 64px rgba(0,0,0,0.5); position:relative; z-index:1; animation:fadeUp 0.5s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .auth-logo { text-align:center; margin-bottom:32px; }
        .logo-link { font-family:'Outfit',sans-serif; font-size:26px; font-weight:800; text-decoration:none; color:#fff; }
        .logo-link span { background:linear-gradient(135deg,var(--blue2),var(--violet2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .admin-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(124,58,237,0.15); color:var(--violet2); border:1px solid rgba(124,58,237,0.3); border-radius:20px; padding:4px 14px; font-size:12px; font-weight:600; margin-top:8px; }
        .alert { padding:11px 14px; border-radius:10px; margin-bottom:14px; font-size:13.5px; display:flex; align-items:center; gap:8px; }
        .alert-error { background:rgba(220,38,38,0.15); color:#fca5a5; border:1px solid rgba(220,38,38,0.3); }
        .form-group { margin-bottom:18px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:7px; }
        .form-input { width:100%; padding:12px 16px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:10px; font-size:15px; color:#fff; outline:none; transition:all 0.2s; font-family:'Inter',sans-serif; }
        .form-input::placeholder { color:rgba(255,255,255,0.25); }
        .form-input:focus { border-color:rgba(124,58,237,0.6); background:rgba(255,255,255,0.08); box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
        .pwd-wrapper { position:relative; display:flex; align-items:center; }
        .pwd-toggle { position:absolute; right:13px; background:none; border:none; cursor:pointer; color:rgba(255,255,255,0.35); display:flex; align-items:center; padding:0; transition:color 0.2s; }
        .pwd-toggle:hover { color:rgba(255,255,255,0.7); }
        .pwd-toggle svg { width:18px; height:18px; }
        .btn-submit { width:100%; padding:14px; margin-top:8px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--violet),var(--blue)); color:#fff; font-family:'Inter',sans-serif; transition:all 0.25s; box-shadow:0 4px 20px rgba(124,58,237,0.35); }
        .btn-submit:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(124,58,237,0.5); filter:brightness(1.08); }
        .auth-links { text-align:center; font-size:13px; color:rgba(255,255,255,0.3); margin-top:20px; }
        .auth-links a { color:rgba(255,255,255,0.45); text-decoration:none; transition:color 0.2s; }
        .auth-links a:hover { color:var(--blue2); }
    </style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="auth-card">
    <div class="auth-logo">
        <a href="{% url 'home' %}" class="logo-link">Fix<span>Now</span></a>
        <div><span class="admin-badge">🔐 Admin Portal</span></div>
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-error">⚠️ {{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="POST" action="">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="username">Admin Email</label>
            <input type="email" id="username" name="username" class="form-input" placeholder="admin@fixnow.com" required autocomplete="username"/>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="pwd-wrapper">
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required style="padding-right:44px;" autocomplete="current-password"/>
                <button type="button" class="pwd-toggle" onclick="togglePwd('password',this)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-submit">Access Admin Panel →</button>
    </form>
    <div class="auth-links"><a href="{% url 'home' %}">← Back to Home</a></div>
</div>
<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = isText
        ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>`;
}
</script>
</body>
</html>
