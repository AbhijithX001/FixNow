{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password | FixNow</title>
    <link rel="stylesheet" href="{% static 'css/fixnow.css' %}">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px; }
        .auth-wrap { width: 100%; max-width: 420px; }
        .auth-logo { font-family: var(--fn-font-head); font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--fn-text-1); margin-bottom: 40px; display: block; text-align: center; }
        .auth-card { background: var(--fn-bg-card); border: 1px solid var(--fn-border); border-radius: var(--fn-radius-card); padding: 36px; }
        .auth-title { font-family: var(--fn-font-head); font-size: 22px; font-weight: 800; color: var(--fn-text-1); letter-spacing: -0.02em; margin-bottom: 6px; }
        .auth-sub { font-size: 14px; color: var(--fn-text-3); margin-bottom: 28px; }
        .info-box { background: rgba(37, 99, 235, 0.05); border: 1px solid rgba(37, 99, 235, 0.2); border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; font-size: 13.5px; color: var(--fn-text-2); line-height: 1.6; display: flex; gap: 10px; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--fn-text-3); }
        .auth-footer a { color: var(--fn-text-1); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <a href="{% url 'home' %}" class="auth-logo">FixNow</a>
        <div class="auth-card">
            <div class="auth-title">Reset Password</div>
            <div class="auth-sub">Enter your email address and we'll send you a link to reset your password.</div>

            <form method="POST">
                {% csrf_token %}
                <div class="fn-field">
                    <label class="fn-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="fn-input" placeholder="you@example.com" required autocomplete="email"/>
                </div>
                <button type="submit" class="fn-btn fn-btn-primary fn-btn-full" style="margin-top:8px;">Send Reset Link</button>
            </form>
        </div>
        <div class="auth-footer">
            <a href="{% url 'user_login' %}">← Back to Login</a>
        </div>
    </div>
</body>
</html>
