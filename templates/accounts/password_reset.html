{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password | FixNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root { --navy:#050d1f; --blue:#2563eb; --blue2:#3b82f6; --violet:#7c3aed; --violet2:#a855f7; --glass-bg:rgba(255,255,255,0.045); --glass-border:rgba(255,255,255,0.10); --input-bg:rgba(255,255,255,0.06); --input-border:rgba(255,255,255,0.14); }
        body { font-family:'Inter',sans-serif; background:var(--navy); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; position:relative; overflow:hidden; }
        .bg-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
        .orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(37,99,235,0.25) 0%,transparent 70%); top:-15%; left:-10%; }
        .orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%); bottom:-10%; right:-10%; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
        .auth-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:24px; padding:44px 40px; width:100%; max-width:420px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 24px 64px rgba(0,0,0,0.5); position:relative; z-index:1; animation:fadeUp 0.5s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .auth-logo { text-align:center; margin-bottom:28px; }
        .logo-link { font-family:'Outfit',sans-serif; font-size:26px; font-weight:800; text-decoration:none; color:#fff; }
        .logo-link span { background:linear-gradient(135deg,var(--blue2),var(--violet2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .auth-subtitle { font-size:14px; color:rgba(255,255,255,0.45); margin-top:6px; }
        .info-box { background:rgba(37,99,235,0.1); border:1px solid rgba(37,99,235,0.25); border-radius:12px; padding:14px 16px; margin-bottom:22px; font-size:13.5px; color:rgba(255,255,255,0.6); line-height:1.6; display:flex; gap:10px; }
        .form-group { margin-bottom:18px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:7px; }
        .form-input { width:100%; padding:12px 16px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:10px; font-size:15px; color:#fff; outline:none; transition:all 0.2s; font-family:'Inter',sans-serif; }
        .form-input::placeholder { color:rgba(255,255,255,0.25); }
        .form-input:focus { border-color:rgba(37,99,235,0.6); background:rgba(255,255,255,0.08); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
        .btn-submit { width:100%; padding:14px; margin-top:8px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff; font-family:'Inter',sans-serif; transition:all 0.25s; box-shadow:0 4px 20px rgba(37,99,235,0.35); }
        .btn-submit:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(37,99,235,0.5); filter:brightness(1.08); }
        .auth-links { text-align:center; font-size:13.5px; color:rgba(255,255,255,0.35); margin-top:20px; }
        .auth-links a { color:var(--blue2); font-weight:600; text-decoration:none; }
        .auth-links a:hover { color:var(--violet2); }
    </style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="auth-card">
    <div class="auth-logo">
        <a href="{% url 'home' %}" class="logo-link">Fix<span>Now</span></a>
        <p class="auth-subtitle">Reset your password</p>
    </div>
    <div class="info-box">
        📧 Enter your email address and we'll send you a link to reset your password.
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <button type="submit" class="btn-submit">Send Reset Link →</button>
    </form>
    <div class="auth-links"><a href="{% url 'user_login' %}">← Back to Login</a></div>
</div>
</body>
</html>
