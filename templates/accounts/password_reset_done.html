{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Check Your Email | FixNow</title>
    <link rel="stylesheet" href="{% static 'css/fixnow.css' %}">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px; }
        .auth-wrap { width: 100%; max-width: 420px; }
        .auth-logo { font-family: var(--fn-font-head); font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--fn-text-1); margin-bottom: 40px; display: block; text-align: center; }
        .auth-card { background: var(--fn-bg-card); border: 1px solid var(--fn-border); border-radius: var(--fn-radius-card); padding: 36px; text-align: center; }
        .auth-title { font-family: var(--fn-font-head); font-size: 22px; font-weight: 800; color: var(--fn-text-1); letter-spacing: -0.02em; margin-bottom: 12px; }
        .auth-sub { font-size: 14px; color: var(--fn-text-3); margin-bottom: 28px; line-height: 1.6; }
        .success-icon { font-size: 48px; margin-bottom: 20px; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--fn-text-3); }
        .auth-footer a { color: var(--fn-text-1); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    </style>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
</head>
<body>
    <div class="auth-wrap">
        <a href="{% url 'home' %}" class="auth-logo">FixNow</a>
        <div class="auth-card">
            <div class="success-icon">📬</div>
            <div class="auth-title">Check your email</div>
            <div class="auth-sub">We've sent a password reset link to your email address. Check your inbox (and spam folder) and follow the link to set a new password.</div>
            <a href="{% url 'user_login' %}" class="fn-btn fn-btn-primary fn-btn-full" style="text-decoration: none; display: inline-block;">Back to Login</a>
        </div>
    </div>
</body>
</html>
