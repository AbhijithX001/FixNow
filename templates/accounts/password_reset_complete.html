{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Password Changed | FixNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#050d1f; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; position:relative; overflow:hidden; }
        .bg-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
        .orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(16,185,129,0.2) 0%,transparent 70%); top:-15%; left:-10%; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
        .card { background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.10); border-radius:24px; padding:52px 44px; width:100%; max-width:440px; backdrop-filter:blur(20px); box-shadow:0 24px 64px rgba(0,0,0,0.5); position:relative; z-index:1; text-align:center; animation:fadeUp 0.5s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .logo-link { font-family:'Outfit',sans-serif; font-size:24px; font-weight:800; text-decoration:none; color:#fff; display:inline-block; margin-bottom:28px; }
        .logo-link span { background:linear-gradient(135deg,#3b82f6,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .success-icon { width:72px; height:72px; border-radius:20px; margin:0 auto 20px; background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(6,182,212,0.25)); border:1px solid rgba(16,185,129,0.35); display:flex; align-items:center; justify-content:center; font-size:32px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.3s both; }
        @keyframes popIn { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
        h1 { font-family:'Outfit',sans-serif; font-size:22px; font-weight:800; margin-bottom:12px; }
        p { font-size:14px; color:rgba(255,255,255,0.5); line-height:1.7; margin-bottom:28px; }
        .btn-primary { display:inline-flex; align-items:center; gap:8px; padding:13px 36px; border-radius:10px; font-size:15px; font-weight:700; text-decoration:none; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; transition:all 0.25s; box-shadow:0 4px 20px rgba(37,99,235,0.35); }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(37,99,235,0.5); filter:brightness(1.08); }
    </style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="card">
    <a href="{% url 'home' %}" class="logo-link">Fix<span>Now</span></a>
    <div class="success-icon">✅</div>
    <h1>Password Changed!</h1>
    <p>Your password has been successfully updated. You can now sign in to your account with your new password.</p>
    <a href="{% url 'user_login' %}" class="btn-primary">Sign In →</a>
</div>
</body>
</html>
