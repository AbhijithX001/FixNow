{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Email | FixNow</title>
    <link rel="stylesheet" href="{% static 'css/fixnow.css' %}">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px; }
        .auth-wrap { width: 100%; max-width: 480px; }
        .auth-logo { font-family: var(--fn-font-head); font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--fn-text-1); margin-bottom: 40px; display: block; text-align: center; }
        .auth-card { background: var(--fn-bg-card); border: 1px solid var(--fn-border); border-radius: var(--fn-radius-card); padding: 36px; text-align: center; }
        .auth-title { font-family: var(--fn-font-head); font-size: 22px; font-weight: 800; color: var(--fn-text-1); letter-spacing: -0.02em; margin-bottom: 6px; }
        .auth-sub { font-size: 14px; color: var(--fn-text-3); margin-bottom: 16px; }
        
        .otp-input {
            width: 100%; padding: 16px; background: var(--fn-bg);
            border: 1.5px solid var(--fn-border); border-radius: 12px;
            font-size: 28px; letter-spacing: 16px; text-align: center; font-weight: 700;
            color: var(--fn-text-1); outline: none; transition: all 0.2s; margin-bottom: 16px;
            font-family: var(--fn-font-head);
        }
        .otp-input::placeholder { color: var(--fn-text-3); letter-spacing: 8px; font-size: 22px; }
        .otp-input:focus { border-color: var(--fn-text-1); box-shadow: 0 0 0 3px rgba(200, 241, 53, 0.25); }

        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--fn-text-3); }
        .auth-footer a { color: var(--fn-text-1); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
        
        .timer-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fefce8; color: #a16207; border: 1px solid #fde68a;
            border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <a href="{% url 'home' %}" class="auth-logo">FixNow</a>
        <div class="auth-card">
            <div style="font-size: 32px; margin-bottom: 16px;">📧</div>
            <div class="auth-title">Verify Your Email</div>
            <div class="auth-sub">We sent a 6-digit code to<br><strong style="color: var(--fn-text-1);">{{ masked_email }}</strong></div>
            <div class="timer-badge">⏱ Code expires in 10 minutes</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="fn-alert {% if message.tags == 'error' %}fn-alert-error{% else %}fn-alert-success{% endif %}" style="text-align: left; margin-bottom: 16px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'verify_otp' %}">
                {% csrf_token %}
                <input type="text" id="otp" name="otp" class="otp-input" placeholder="······"
                       maxlength="6" minlength="6" inputmode="numeric" pattern="[0-9]{6}"
                       autocomplete="one-time-code" autofocus required/>
                <button type="submit" class="fn-btn fn-btn-primary fn-btn-full" style="padding: 14px 0; font-size: 15px;">Verify &amp; Create Account</button>
            </form>

            <form method="POST" action="{% url 'resend_otp' %}" style="margin-top: 12px;">
                {% csrf_token %}
                <button type="submit" class="fn-btn fn-btn-ghost fn-btn-full">Resend Code</button>
            </form>

            <div class="auth-footer">
                <a href="{% url 'home' %}">← Cancel Registration</a>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('otp').addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });
    </script>
</body>
</html>
